name: hydrocare
description: "HydroCare — Aplikasi monitoring hidrasi berbasis analisis warna urin."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Local storage
  shared_preferences: ^2.3.3

  # Charts
  fl_chart: ^0.70.2

  # Fonts (Poppins via google_fonts — cached setelah download pertama)
  google_fonts: ^6.2.1

  # HTTP client (stub — digunakan saat integrasi backend)
  dio: ^5.7.0

  # SVG rendering
  flutter_svg: ^2.0.16

  # Kamera (live preview) & galeri
  camera: ^0.11.1
  image_picker: ^1.1.2
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/water_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#EAF4FB"
  adaptive_icon_foreground: "assets/images/water_logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/images/
